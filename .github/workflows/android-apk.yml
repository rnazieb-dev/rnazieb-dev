name: android-apk
# Membangun APK Android di GitHub Actions (gratis untuk repo publik; kuota menit untuk repo privat) — tanpa EAS Build.
on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'Arsitektur CPU (arm64-v8a = hampir semua HP modern; isi "armeabi-v7a,arm64-v8a,x86,x86_64" untuk semua)'
        default: arm64-v8a
      bundle:
        description: 'Bangun juga AAB (untuk Google Play)'
        type: boolean
        default: false
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/esok
    env:
      EXPO_PUBLIC_APP_ENV: ${{ vars.EXPO_PUBLIC_APP_ENV || 'staging' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_DONATE_URL: ${{ vars.EXPO_PUBLIC_DONATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/esok/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run validate:content
      - name: Prebuild (hasilkan folder android/)
        run: npx expo prebuild --platform android --no-install
      - name: Keystore rilis (opsional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.keystore
            echo "ANDROID_KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
      - run: node scripts/android-release-signing.mjs
      - name: Bangun APK
        working-directory: apps/esok/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures="${{ inputs.abis || 'arm64-v8a' }}" --no-daemon
      - name: Bangun AAB (opsional)
        if: ${{ inputs.bundle }}
        working-directory: apps/esok/android
        run: ./gradlew bundleRelease -PreactNativeArchitectures="${{ inputs.abis || 'arm64-v8a' }}" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nafs-android
          path: |
            apps/esok/android/app/build/outputs/apk/release/*.apk
            apps/esok/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
